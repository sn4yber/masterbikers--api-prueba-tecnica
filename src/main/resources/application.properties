spring.application.name=master-bikers
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masterbikers}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.web.pageable.max-page-size=100
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
scraper.automation-exercise.base-url=${AUTOMATION_EXERCISE_BASE_URL:https://automationexercise.com}
scraper.automation-exercise.timeout-ms=${SCRAPER_TIMEOUT_MS:10000}
scraper.automation-exercise.retry.max-attempts=${SCRAPER_MAX_ATTEMPTS:3}
scraper.automation-exercise.retry.initial-backoff-ms=${SCRAPER_INITIAL_BACKOFF_MS:200}
scraper.automation-exercise.retry.max-backoff-ms=${SCRAPER_MAX_BACKOFF_MS:2000}
management.endpoints.web.exposure.include=health,metrics
